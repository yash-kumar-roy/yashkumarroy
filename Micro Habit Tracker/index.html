<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Micro Habit Tracker</title>
<style>
  :root{
    --bg:#0f1724; --card:#071129; --muted:#9aa6b2; --accent:#06b6d4; --accent-2:#7c3aed;
    --good:#10b981; --skip:#f59e0b; --bad:#ef4444;
    --glass: rgba(255,255,255,0.04);
    --max-habits:7;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,'Helvetica Neue',Arial;background:linear-gradient(180deg,var(--bg),#071033);color:#e6f0f6}

  .app{min-height:100vh;display:flex;flex-direction:column;gap:12px;padding:16px;align-items:center}
  header{width:100%;max-width:980px;display:flex;align-items:center;gap:12px}
  h1{margin:0;font-size:20px;letter-spacing:0.2px}
  .lead{color:var(--muted);font-size:13px}

  .board{width:100%;max-width:980px;background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));border-radius:12px;padding:12px;border:1px solid rgba(255,255,255,0.04);box-shadow:0 10px 30px rgba(2,6,23,0.6)}

  .topbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .btn{background:transparent;border:1px solid rgba(255,255,255,0.06);color:var(--muted);padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px}
  .btn.primary{background:linear-gradient(90deg,var(--accent),var(--accent-2));border:0;color:#041024;font-weight:700}
  .btn.ghost{background:transparent}
  .btn:hover{border-color:rgba(255,255,255,0.18);color:#e6f0f6}
  .btn.primary:hover{color:#041024;filter:brightness(1.08)}
  .btn:disabled{opacity:0.5;cursor:not-allowed}
  .empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed rgba(255,255,255,0.08);border-radius:10px}

  .content{display:flex;gap:12px;margin-top:12px}
  .left{flex:1;min-width:0}
  .right{width:320px;max-width:40%;flex:0 0 auto}

  .habit-list{display:flex;flex-direction:column;gap:8px}
  .habit{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:8px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));border:1px solid rgba(255,255,255,0.02)}
  .dot{width:38px;height:38px;flex:0 0 38px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,0.45)}
  .hmeta{flex:1 1 120px;min-width:0}
  .hname{font-weight:600;overflow-wrap:anywhere}
  .hactions{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}
  .hsub{font-size:13px;color:var(--muted)}

  .days{display:flex;gap:6px;align-items:center;overflow-x:auto;padding:8px 4px;min-width:0;max-width:100%}
  .day{width:36px;height:36px;flex:0 0 36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font:inherit;font-size:11px;padding:0;color:inherit;background:transparent;border:1px solid rgba(255,255,255,0.08);cursor:pointer}
  .day:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .day.today{box-shadow:0 0 0 1px rgba(6,182,212,0.55)}
  .day.good{background:linear-gradient(180deg, rgba(16,185,129,0.18), rgba(16,185,129,0.08));border-color:rgba(16,185,129,0.3);color:#dffaf0}
  .day.skip{background:linear-gradient(180deg, rgba(245,158,11,0.13), rgba(245,158,11,0.06));border-color:rgba(245,158,11,0.2);color:#fff7e6}
  .day.none{background:transparent;color:var(--muted)}

  .stat{display:flex;gap:8px;align-items:center}
  .streak{font-weight:700;color:var(--accent)}
  .small{font-size:13px;color:var(--muted)}

  .right .card{background:transparent;border:0;padding:0}
  .chart{min-height:120px;border-radius:8px;padding:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.005));border:1px solid rgba(255,255,255,0.02);display:flex;flex-direction:column;gap:8px}
  .spark{display:flex;gap:6px;align-items:end;height:56px}
  .bar{flex:1;max-width:22px;border-radius:4px;background:rgba(255,255,255,0.08)}
  .bar.filled{background:linear-gradient(180deg,var(--accent),var(--accent-2))}

  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

  footer{width:100%;max-width:980px;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between}

  /* responsive */
  @media (max-width:900px){
    .content{flex-direction:column}
    .right{width:100%;max-width:100%}
    .days{padding:6px}
  }
  @media (max-width:520px){
    .app{padding:12px 10px}
    .board{padding:10px}
    .days{order:3;flex:1 1 100%;padding:4px 0;justify-content:space-between}
    .day{flex:1 1 0;width:auto;min-width:32px;max-width:44px}
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <div style="display:flex;flex-direction:column;">
        <h1>Micro Habit Tracker</h1>
        <div class="lead">Track up to 7 daily micro habits — quick checkmarks, streaks, and simple charts.</div>
      </div>
    </header>

    <div class="board">
      <div class="topbar">
        <button id="addHabit" class="btn primary">+ Add Habit</button>
        <button id="exportBtn" class="btn">Export JSON</button>
        <button id="importBtn" class="btn">Import JSON</button>
        <div style="flex:1"></div>
        <div class="small">Today: <strong id="todayLabel"></strong></div>
      </div>

      <div class="content">
        <div class="left">
          <div class="habit-list" id="habitList"></div>
        </div>
        <div class="right">
          <div class="chart" id="overviewCard">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div style="font-weight:700">Weekly Overview</div>
              <div class="small">Last 7 days</div>
            </div>
            <div class="spark" id="overviewSpark"></div>
            <div style="display:flex;justify-content:space-between;align-items:center">
              <div class="small">Total habits: <strong id="totalHabits">0</strong></div>
              <div class="small">Avg completion: <strong id="avgComp">0%</strong></div>
            </div>
            <div class="controls">
              <button id="clearData" class="btn ghost">Clear Data</button>
              <button id="resetStreaks" class="btn ghost">Reset Streaks</button>
            </div>
          </div>
        </div>
      </div>

    </div>

    <footer>
      <div>Compact • Inspiring • Mobile-ready</div>
      <div>Local-only • JSON export/import</div>
    </footer>
  </div>

  <!-- Edit/Add modal (simple) -->
  <div id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" style="display:none;position:fixed;inset:0;background:rgba(2,6,23,0.6);align-items:center;justify-content:center;padding:12px;z-index:10">
    <div style="background:var(--card);padding:16px;border-radius:10px;width:360px;max-width:92%;border:1px solid rgba(255,255,255,0.04)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px"><strong id="modalTitle">Add Habit</strong><button id="closeModal" class="btn">Close</button></div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <input id="habitName" maxlength="60" aria-label="Habit name" placeholder="Habit name (e.g. 5-min reading)" style="padding:8px;border-radius:6px;border:1px solid rgba(255,255,255,0.04);background:transparent;color:inherit">
        <input id="habitColor" type="color" aria-label="Habit color" value="#7c3aed" style="width:100%;height:38px;border-radius:6px;border:0;padding:4px">
        <div style="display:flex;gap:8px;justify-content:flex-end">
          <button id="saveHabit" class="btn primary">Save</button>
        </div>
      </div>
    </div>
  </div>

<script>
// --- Data model ---
const MAX_HABITS = 7;
const STORAGE_KEY = 'micro_habits_v1';
const VALID_STATES = ['good', 'skip'];

// --- Utils ---
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
// Local calendar date as YYYY-MM-DD (toISOString() is UTC and shifts the day in many timezones)
function toISO(d){ const dt=new Date(d); const p=n=>String(n).padStart(2,'0'); return `${dt.getFullYear()}-${p(dt.getMonth()+1)}-${p(dt.getDate())}`; }
function dateShift(d, offset){ const c=new Date(d); c.setDate(c.getDate()+offset); return c; }
function load(){ try{ const raw = localStorage.getItem(STORAGE_KEY); return raw? normalizeStore(JSON.parse(raw)) : null;}catch(e){return null;} }
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }catch(e){ /* storage unavailable — keep working in memory */ } }

// Validate/clean data from storage or an imported file
function normalizeStore(data){
  if(!data || !Array.isArray(data.habits)) return null;
  const habits = data.habits
    .filter(h => h && typeof h.name === 'string' && h.name.trim())
    .slice(0, MAX_HABITS)
    .map(h => {
      const records = {};
      if(h.records && typeof h.records === 'object'){
        Object.keys(h.records).forEach(k => {
          if(/^\d{4}-\d{2}-\d{2}$/.test(k) && VALID_STATES.includes(h.records[k])) records[k] = h.records[k];
        });
      }
      const color = /^#[0-9a-f]{6}$/i.test(h.color) ? h.color : '#7c3aed';
      return { id: typeof h.id === 'string' && h.id ? h.id : uid(), name: h.name.trim().slice(0, 60), color, records };
    });
  return { habits, created: typeof data.created === 'string' ? data.created : toISO(new Date()) };
}

// demo data (few days)
function demoData(){
  const today = toISO(dateShift(new Date(),0));
  const d1 = toISO(dateShift(new Date(),-1));
  const d2 = toISO(dateShift(new Date(),-2));
  const d3 = toISO(dateShift(new Date(),-3));
  return {
    habits: [
      {id:uid(),name:'5‑min reading',color:'#7c3aed',records:{[d3]:'good',[d2]:'good',[today]:'good'}},
      {id:uid(),name:'Meditate',color:'#06b6d4',records:{[d3]:'skip',[d2]:'good',[d1]:'good'}},
      {id:uid(),name:'Walk 10 min',color:'#10b981',records:{[d2]:'good',[d1]:'good',[today]:'good'}},
    ],
    created: toISO(new Date())
  };
}

let store = load() || demoData();

// --- DOM refs ---
const habitList = document.getElementById('habitList');
const addHabit = document.getElementById('addHabit');
const exportBtn = document.getElementById('exportBtn');
const importBtn = document.getElementById('importBtn');
const modal = document.getElementById('modal');
const habitName = document.getElementById('habitName');
const habitColor = document.getElementById('habitColor');
const saveHabit = document.getElementById('saveHabit');
const closeModal = document.getElementById('closeModal');
const todayLabel = document.getElementById('todayLabel');
const overviewSpark = document.getElementById('overviewSpark');
const totalHabits = document.getElementById('totalHabits');
const avgComp = document.getElementById('avgComp');
const clearData = document.getElementById('clearData');
const resetStreaks = document.getElementById('resetStreaks');

let editingId = null;
let lastFocus = null;

// compute last N days (including today), oldest first
function lastNDays(n){ const arr=[]; for(let i=n-1;i>=0;i--){ arr.push(toISO(dateShift(new Date(), -i))); } return arr; }
let DAYS = lastNDays(7);
const STATE_LABEL = { good: 'done', skip: 'skipped', none: 'not logged' };

// --- Rendering ---
function render(){
  DAYS = lastNDays(7); // recompute so the board rolls over at midnight
  todayLabel.textContent = DAYS[DAYS.length-1];
  habitList.innerHTML = '';
  if(!store.habits.length){
    const empty = document.createElement('div'); empty.className='empty';
    empty.textContent = 'No habits yet — tap “+ Add Habit” to start tracking.';
    habitList.appendChild(empty);
  }
  store.habits.forEach(h => habitList.appendChild(renderHabit(h)));
  renderOverview();
  totalHabits.textContent = store.habits.length;
  addHabit.disabled = store.habits.length >= MAX_HABITS;
  addHabit.title = addHabit.disabled ? `Maximum ${MAX_HABITS} habits` : '';
  save();
}

function renderHabit(h){
  const el = document.createElement('div'); el.className='habit';
  const dot = document.createElement('div'); dot.className='dot'; dot.style.background=h.color; dot.textContent = (Array.from(h.name.trim())[0] || '?').toUpperCase();
  const meta = document.createElement('div'); meta.className='hmeta';
  const name = document.createElement('div'); name.className='hname'; name.textContent = h.name;
  const streak = calcStreak(h);
  const sub = document.createElement('div'); sub.className='hsub';
  sub.textContent = `Streak: ${streak} day${streak===1?'':'s'} • Today: ${STATE_LABEL[lastStatus(h)]}`;
  meta.appendChild(name); meta.appendChild(sub);

  const daysWrap = document.createElement('div'); daysWrap.className='days';
  DAYS.slice().reverse().forEach((dt, idx)=>{
    const st = h.records[dt] || 'none';
    const d = document.createElement('button'); d.type='button';
    d.className='day '+(st==='good'?'good':st==='skip'?'skip':'none');
    d.dataset.date = dt;
    const label = idx===0 ? 'Today' : dt;
    d.title = `${label}: ${STATE_LABEL[st]} — click to change`;
    d.setAttribute('aria-label', `${h.name}, ${label}: ${STATE_LABEL[st]}`);
    d.textContent = dt.slice(5);
    if(idx===0) d.classList.add('today');
    d.addEventListener('click', ()=>{ cycleDay(h.id, dt); });
    daysWrap.appendChild(d);
  });

  const actions = document.createElement('div'); actions.className='hactions';
  const edit = document.createElement('button'); edit.type='button'; edit.className='btn'; edit.textContent='Edit'; edit.addEventListener('click',()=>openEdit(h.id));
  const del = document.createElement('button'); del.type='button'; del.className='btn'; del.textContent='Delete'; del.addEventListener('click',()=>{ if(confirm(`Delete habit “${h.name}”?`)){ deleteHabit(h.id); }});
  actions.appendChild(edit); actions.appendChild(del);

  el.appendChild(dot); el.appendChild(meta); el.appendChild(daysWrap); el.appendChild(actions);
  return el;
}

function renderOverview(){
  // completion across habits for each of the last 7 days (oldest → today)
  overviewSpark.innerHTML='';
  let sumPct=0;
  DAYS.forEach(d=>{
    let done=0;
    store.habits.forEach(h=>{ if(h.records[d]==='good') done++; });
    const pct = store.habits.length ? done / store.habits.length : 0;
    sumPct += pct;
    const bar = document.createElement('div'); bar.className='bar'+(pct>0?' filled':'');
    bar.style.height = Math.max(6, Math.round(pct*56))+'px';
    bar.title = `${d}: ${Math.round(pct*100)}% (${done}/${store.habits.length})`;
    overviewSpark.appendChild(bar);
  });
  const avg = DAYS.length ? Math.round((sumPct/DAYS.length)*100) : 0;
  avgComp.textContent = avg + '%';
}

// --- Actions ---
addHabit.addEventListener('click', ()=>{
  if(store.habits.length>=MAX_HABITS){ alert('Maximum '+MAX_HABITS+' habits allowed.'); return; }
  editingId = null; habitName.value=''; habitColor.value='#7c3aed'; openModal();
});

function submitHabit(){
  const name = habitName.value.trim(); if(!name) { alert('Enter a habit name'); habitName.focus(); return; }
  const color = habitColor.value;
  if(editingId){
    const h = store.habits.find(x=>x.id===editingId); if(h){ h.name = name; h.color = color; }
  } else {
    if(store.habits.length>=MAX_HABITS){ alert('Maximum '+MAX_HABITS+' habits allowed.'); return; }
    const h = {id:uid(),name,color,records:{}}; store.habits.push(h);
  }
  closeModalFunc(); render();
}
saveHabit.addEventListener('click', submitHabit);
habitName.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); submitHabit(); } });
closeModal.addEventListener('click', closeModalFunc);
modal.addEventListener('click', e=>{ if(e.target===modal) closeModalFunc(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.style.display==='flex') closeModalFunc(); });
function openModal(){
  lastFocus = document.activeElement;
  modal.style.display='flex';
  document.getElementById('modalTitle').textContent = editingId? 'Edit Habit' : 'Add Habit';
  setTimeout(()=>habitName.focus(), 0);
}
function closeModalFunc(){
  modal.style.display='none'; editingId=null;
  if(lastFocus && document.contains(lastFocus)) lastFocus.focus();
}
function openEdit(id){ const h = store.habits.find(x=>x.id===id); if(!h) return; editingId = id; habitName.value = h.name; habitColor.value = h.color || '#7c3aed'; openModal(); }

function deleteHabit(id){ store.habits = store.habits.filter(h=>h.id!==id); render(); }

function cycleDay(hid, date){
  const h = store.habits.find(x=>x.id===hid); if(!h) return;
  const cur = h.records[date] || 'none';
  const next = cur==='none'? 'good' : cur==='good'? 'skip' : 'none';
  // remove none entries to keep data small
  if(next==='none') delete h.records[date]; else h.records[date] = next;
  render();
  // keep keyboard focus on the same day cell after re-render
  const cell = habitList.querySelector(`.habit:nth-child(${store.habits.findIndex(x=>x.id===hid)+1}) .day[data-date="${date}"]`);
  if(cell) cell.focus({preventScroll:true});
}

// Streak = consecutive 'good' days ending today, across the full history.
// 'skip' days don't break (or add to) a streak. If today isn't logged yet,
// the streak still counts up to yesterday so it doesn't drop to 0 each morning.
function calcStreak(h){
  let streak = 0;
  let i = 0;
  if(!h.records[toISO(new Date())]) i = 1;
  for(; i <= 3660; i++){ // safety cap (~10 years)
    const s = h.records[toISO(dateShift(new Date(), -i))];
    if(s==='good') streak++;
    else if(s!=='skip') break;
  }
  return streak;
}
function lastStatus(h){ return h.records[DAYS[DAYS.length-1]]||'none'; }

// export/import
exportBtn.addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(store, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'micro_habits.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
});

importBtn.addEventListener('click', ()=>{
  const inp = document.createElement('input'); inp.type='file'; inp.accept='application/json,.json'; inp.onchange = async (ev)=>{
    const f = ev.target.files[0]; if(!f) return;
    try{
      const data = normalizeStore(JSON.parse(await f.text()));
      if(data){ store = data; render(); alert(`Imported ${data.habits.length} habit${data.habits.length===1?'':'s'}.`); }
      else alert('Invalid file: expected a JSON export with a "habits" list.');
    } catch(e){ alert('Could not read file: '+e.message); }
  }; inp.click();
});

clearData.addEventListener('click', ()=>{ if(confirm('Clear all recorded days (keeps habit names)?')){ store.habits.forEach(h=>h.records={}); render(); } });
resetStreaks.addEventListener('click', ()=>{
  if(confirm('Reset streaks by clearing the last 7 days? Older history is kept.')){
    store.habits.forEach(h=>{ DAYS.forEach(d=>{ delete h.records[d]; }); });
    render();
  }
});

// Re-render when the tab becomes visible again (e.g. after midnight)
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && DAYS[DAYS.length-1] !== toISO(new Date())) render(); });

// init rendering
render();

</script>
</body>
</html>
