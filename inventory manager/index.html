<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Search</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
            width: 100%;
            max-width: 600px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            font-weight: 300;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .search-section {
            margin-bottom: 30px;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        #searchInput {
            width: 100%;
            padding: 15px 20px;
            font-size: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            background: white;
            transition: all 0.3s ease;
            outline: none;
        }

        #searchInput:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        #searchBtn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }

        #searchBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        #searchBtn:active {
            transform: translateY(0);
        }

        .result-container {
            margin-top: 20px;
            padding: 20px;
            border-radius: 15px;
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            transition: all 0.3s ease;
        }

        .result-success {
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border-left-color: #28a745;
            color: #155724;
        }

        .result-error {
            background: linear-gradient(135deg, #f8d7da, #f1b0b7);
            border-left-color: #dc3545;
            color: #721c24;
        }

        .result-text {
            font-size: 18px;
            font-weight: 500;
        }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .inventory-table th,
        .inventory-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .inventory-table thead tr {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .inventory-table th {
            background: transparent;
            color: white;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inventory-table tbody tr:hover {
            background: #f8f9fa;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .status-section {
            margin-bottom: 20px;
            padding: 15px;
            background: linear-gradient(135deg, #d4edda, #c3e6cb);
            border-radius: 15px;
            border-left: 5px solid #28a745;
            text-align: center;
            color: #155724;
        }

        .status-section.status-pending {
            background: linear-gradient(135deg, #e7ebff, #dfe3fb);
            border-left-color: #667eea;
            color: #3b4796;
        }

        .status-section.status-error {
            background: linear-gradient(135deg, #f8d7da, #f1b0b7);
            border-left-color: #dc3545;
            color: #721c24;
        }

        .result-info {
            color: #444;
        }

        #searchBtn:disabled {
            opacity: 0.7;
            cursor: wait;
            transform: none;
            box-shadow: none;
        }

        .inventory-table td:last-child,
        .inventory-table th:last-child {
            text-align: right;
            white-space: nowrap;
        }

        .inventory-table tbody tr:focus-visible {
            outline: 2px solid #667eea;
            outline-offset: -2px;
        }

        .inventory-table tbody tr:last-child td {
            border-bottom: none;
        }

        .result-text {
            overflow-wrap: anywhere;
        }

        @media (max-width: 768px) {
            body {
                padding: 12px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 2em;
                margin-bottom: 20px;
            }
        }

        @media (max-width: 420px) {
            .container {
                padding: 16px;
                border-radius: 16px;
            }

            h1 {
                font-size: 1.6em;
            }

            .result-text {
                font-size: 16px;
            }

            .inventory-table th,
            .inventory-table td {
                padding: 12px 10px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔍 Inventory Search</h1>

        <div class="status-section status-pending" id="connectionStatus" role="status">🔌 Connecting to database...</div>
        


        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="Enter product name to search inventory..."
                    aria-label="Product name"
                    autocomplete="off"
                />
            </div>
            <button id="searchBtn" type="button">Search Inventory</button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Searching...</p>
        </div>

        <div class="result-container" id="resultContainer">
            <div class="result-text">Enter a product name above to search inventory</div>
        </div>

        <table class="inventory-table" id="inventoryTable" style="display: none;">
            <thead>
                <tr>
                    <th>Product Name</th>
                    <th>Inventory</th>
                </tr>
            </thead>
            <tbody id="inventoryBody">
            </tbody>
        </table>
    </div>

    <script>
        // Each row: { name: original product name, key: lowercase name, inventory }
        let inventoryData = [];
        // Same-origin API when served by the portfolio (or Flask) server; local Flask backend when opened as a file.
        const API_BASE_URL = window.location.protocol === 'file:' ? 'http://localhost:5000' : '';
        let searchSeq = 0;

        function setStatus(message, state) {
            const statusDiv = document.getElementById('connectionStatus');
            if (!statusDiv) return;
            statusDiv.textContent = message;
            statusDiv.classList.toggle('status-error', state === 'error');
            statusDiv.classList.toggle('status-pending', state === 'pending');
        }

        // Load inventory data via API
        async function loadInventoryFromDatabase() {
            setStatus('🔌 Connecting to database...', 'pending');
            try {
                const response = await fetch(`${API_BASE_URL}/api/inventory`);
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                const data = await response.json();
                if (!Array.isArray(data)) throw new Error('Unexpected response');
                inventoryData = data
                    .filter(item => item && item.product_name != null)
                    .map(item => ({
                        name: String(item.product_name),
                        key: String(item.product_name).toLowerCase(),
                        inventory: item.inventory
                    }));

                setStatus(`✅ Connected to database — ${inventoryData.length} products loaded`, 'ok');
                displayInventoryTable();
                showResult('Ready to search inventory! Type a name or click a row below.', 'info');
            } catch (error) {
                console.error('Database connection error:', error);
                setStatus('❌ Unable to connect to database. Please try again later.', 'error');
                showResult('❌ Database connection failed. Please contact support.', 'error');
            }
        }

        function displayInventoryTable() {
            const tbody = document.getElementById('inventoryBody');
            const table = document.getElementById('inventoryTable');
            tbody.innerHTML = '';

            if (inventoryData.length === 0) {
                table.style.display = 'none';
                return;
            }

            inventoryData.forEach(row => {
                const tr = document.createElement('tr');
                tr.tabIndex = 0;
                tr.title = `Search for ${row.name}`;
                const nameTd = document.createElement('td');
                nameTd.textContent = row.name;
                const qtyTd = document.createElement('td');
                qtyTd.textContent = row.inventory;
                tr.append(nameTd, qtyTd);
                const pick = () => {
                    document.getElementById('searchInput').value = row.name;
                    searchInventory();
                };
                tr.addEventListener('click', pick);
                tr.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
                });
                tbody.appendChild(tr);
            });

            table.style.display = 'table';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                searchInventory();
            }
        }

        async function searchInventory() {
            const rawTerm = document.getElementById('searchInput').value.trim();
            const searchTerm = rawTerm.toLowerCase();
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const btn = document.getElementById('searchBtn');

            if (!searchTerm) {
                showResult('❌ Please enter a product name to search', 'error');
                return;
            }

            const seq = ++searchSeq;
            loading.style.display = 'block';
            resultContainer.style.display = 'none';
            btn.disabled = true;

            let message, type;
            try {
                const response = await fetch(`${API_BASE_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_name: searchTerm })
                });
                const result = await response.json().catch(() => ({}));
                if (!response.ok && !('found' in result)) {
                    throw new Error(result.error || `HTTP error! status: ${response.status}`);
                }
                if (result.found) {
                    const local = inventoryData.find(r => r.key === searchTerm);
                    const name = (local && local.name) || result.product_name || rawTerm;
                    message = `✅ Inventory for '${name}': ${result.inventory}`;
                    type = 'success';
                } else {
                    message = `❌ '${rawTerm}' not found. Please try another product.`;
                    type = 'error';
                }
            } catch (error) {
                console.error('Search error:', error);
                message = '❌ Search failed. Please check your connection.';
                type = 'error';
            }

            if (seq !== searchSeq) return; // a newer search superseded this one
            loading.style.display = 'none';
            resultContainer.style.display = 'flex';
            btn.disabled = false;
            showResult(message, type);
        }

        function showResult(message, type) {
            const resultContainer = document.getElementById('resultContainer');
            let resultText = resultContainer.querySelector('.result-text');
            if (!resultText) {
                resultText = document.createElement('div');
                resultContainer.appendChild(resultText);
            }
            resultText.className = 'result-text';
            resultText.textContent = message;

            resultContainer.className = `result-container result-${type}`;

            // Add animation effect
            resultContainer.style.transform = 'scale(0.95)';
            setTimeout(() => {
                resultContainer.style.transform = 'scale(1)';
            }, 100);
        }

        document.getElementById('searchInput').addEventListener('keydown', handleKeyDown);
        document.getElementById('searchBtn').addEventListener('click', searchInventory);

        // Initialize the app
        loadInventoryFromDatabase();
    </script>
</body>
</html>
