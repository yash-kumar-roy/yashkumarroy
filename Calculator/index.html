<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .calculator-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 25px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
            max-width: 450px;
            width: 100%;
        }

        .calculator-header {
            text-align: center;
            margin-bottom: 20px;
        }

        .calculator-header h1 {
            color: white;
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 10px;
        }

        .mode-tabs {
            display: flex;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .mode-tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            border-radius: 8px;
            color: rgba(255, 255, 255, 0.7);
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .mode-tab.active {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        .display {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            min-height: 120px;
        }

        .display-main {
            color: white;
            font-size: 32px;
            font-weight: 300;
            text-align: right;
            margin-bottom: 10px;
            min-height: 40px;
            word-wrap: break-word;
        }

        .display-memory {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            text-align: right;
            margin-bottom: 5px;
        }

        .display-history {
            color: rgba(255, 255, 255, 0.5);
            font-size: 16px;
            text-align: right;
            min-height: 20px;
        }

        .calculator-section {
            display: none;
        }

        .calculator-section.active {
            display: block;
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .currency-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 18px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.2s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-number {
            background: rgba(255, 255, 255, 0.15);
            color: white;
        }

        .btn-operator {
            background: rgba(255, 107, 107, 0.3);
            color: white;
        }

        .btn-function {
            background: rgba(116, 185, 255, 0.3);
            color: white;
            font-size: 14px;
        }

        .btn-memory {
            background: rgba(46, 213, 115, 0.3);
            color: white;
            font-size: 14px;
        }

        .btn-clear {
            background: rgba(255, 118, 117, 0.4);
            color: white;
        }

        .btn-equals {
            background: linear-gradient(45deg, #ff6b6b, #ee5a24);
            color: white;
            grid-column: span 3;
        }

        .btn:focus-visible,
        .mode-tab:focus-visible,
        .angle-toggle:focus-visible {
            outline: 2px solid rgba(255, 255, 255, 0.8);
            outline-offset: 2px;
        }

        .display-memory {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .angle-toggle {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: white;
            border-radius: 6px;
            padding: 2px 8px;
            font-size: 12px;
            letter-spacing: 0.05em;
            cursor: pointer;
        }

        .display-main.long {
            font-size: 24px;
        }

        .display-main.very-long {
            font-size: 18px;
        }

        .display-main,
        .display-history {
            overflow-wrap: anywhere;
        }

        .history-list {
            list-style: none;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 15px;
            padding: 10px;
            margin-bottom: 15px;
            max-height: 420px;
            overflow-y: auto;
        }

        .history-item {
            display: block;
            width: 100%;
            text-align: right;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: white;
            padding: 10px 12px;
            margin-bottom: 8px;
            cursor: pointer;
            font: inherit;
            overflow-wrap: anywhere;
        }

        .history-item:hover {
            background: rgba(255, 255, 255, 0.16);
        }

        .history-item .expr {
            display: block;
            color: rgba(255, 255, 255, 0.6);
            font-size: 13px;
        }

        .history-item .res {
            display: block;
            font-size: 18px;
        }

        .history-empty {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            padding: 20px 0;
        }

        .history-clear {
            width: 100%;
        }

        .currency-input {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            color: white;
            font-size: 16px;
            width: 100%;
            margin-bottom: 15px;
        }

        .currency-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .currency-rate {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            color: white;
            text-align: center;
        }

        .memory-display {
            background: rgba(46, 213, 115, 0.2);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
            color: white;
            text-align: center;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Fit the whole keypad in shorter viewports (e.g. an ~800px tall modal) */
        @media (max-height: 900px) {
            body {
                padding: 12px 20px;
            }

            .calculator-container {
                padding: 20px 25px;
            }

            .calculator-header {
                margin-bottom: 14px;
            }

            .mode-tabs,
            .display {
                margin-bottom: 14px;
            }

            .display {
                min-height: 100px;
                padding: 14px 20px;
            }

            .memory-display {
                min-height: 34px;
                padding: 6px;
                margin-bottom: 12px;
            }

            .btn {
                padding: 14px;
            }

            .button-grid {
                gap: 8px;
                margin-bottom: 4px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 12px;
            }

            .calculator-container {
                padding: 15px;
            }

            .button-grid {
                gap: 8px;
            }

            .btn {
                padding: 14px 4px;
                font-size: 14px;
            }

            .display-main {
                font-size: 24px;
            }

            .display-main.long {
                font-size: 20px;
            }

            .display-main.very-long {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <div class="calculator-header">
            <h1>Scientific Calculator</h1>
            <div class="mode-tabs">
                <div class="mode-tab active" role="button" tabindex="0" data-mode="calculator" onclick="switchMode('calculator')">Calculator</div>
                <div class="mode-tab" role="button" tabindex="0" data-mode="currency" onclick="switchMode('currency')">Currency</div>
                <div class="mode-tab" role="button" tabindex="0" data-mode="history" onclick="switchMode('history')">History</div>
            </div>
        </div>

        <!-- Calculator Section -->
        <div id="calculator" class="calculator-section active">
            <div class="display">
                <div class="display-memory" id="memoryDisplay">
                    <button type="button" class="angle-toggle" id="angleToggle" onclick="toggleAngleMode()" title="Toggle degrees / radians for sin, cos, tan">DEG</button>
                    <span id="memoryIndicator"></span>
                </div>
                <div class="display-history" id="historyDisplay"></div>
                <div class="display-main" id="mainDisplay">0</div>
            </div>

            <div class="memory-display" id="memoryStatus">Memory: Empty</div>

            <div class="button-grid">
                <button class="btn btn-function" onclick="calculateFunction('sin')">sin</button>
                <button class="btn btn-function" onclick="calculateFunction('cos')">cos</button>
                <button class="btn btn-function" onclick="calculateFunction('tan')">tan</button>
                <button class="btn btn-function" onclick="calculateFunction('log')">log</button>
                <button class="btn btn-function" onclick="calculateFunction('ln')">ln</button>

                <button class="btn btn-memory" onclick="memoryStore()">MS</button>
                <button class="btn btn-memory" onclick="memoryRecall()">MR</button>
                <button class="btn btn-memory" onclick="memoryClear()">MC</button>
                <button class="btn btn-memory" onclick="memoryAdd()">M+</button>
                <button class="btn btn-memory" onclick="memorySubtract()">M-</button>

                <button class="btn btn-function" onclick="calculateFunction('sqrt')">√</button>
                <button class="btn btn-function" onclick="calculateFunction('power')">x²</button>
                <button class="btn btn-function" onclick="calculateFunction('factorial')">x!</button>
                <button class="btn btn-operator" onclick="appendParen('(')">(</button>
                <button class="btn btn-operator" onclick="appendParen(')')">)</button>

                <button class="btn btn-clear" onclick="clearAll()">C</button>
                <button class="btn btn-clear" onclick="clearEntry()">CE</button>
                <button class="btn btn-operator" onclick="appendOperator('/')">/</button>
                <button class="btn btn-operator" onclick="appendOperator('*')">×</button>
                <button class="btn btn-clear" onclick="backspace()">⌫</button>

                <button class="btn btn-number" onclick="appendNumber('7')">7</button>
                <button class="btn btn-number" onclick="appendNumber('8')">8</button>
                <button class="btn btn-number" onclick="appendNumber('9')">9</button>
                <button class="btn btn-operator" onclick="appendOperator('-')">-</button>
                <button class="btn btn-function" onclick="calculateFunction('pi')">π</button>

                <button class="btn btn-number" onclick="appendNumber('4')">4</button>
                <button class="btn btn-number" onclick="appendNumber('5')">5</button>
                <button class="btn btn-number" onclick="appendNumber('6')">6</button>
                <button class="btn btn-operator" onclick="appendOperator('+')">+</button>
                <button class="btn btn-function" onclick="calculateFunction('e')">e</button>

                <button class="btn btn-number" onclick="appendNumber('1')">1</button>
                <button class="btn btn-number" onclick="appendNumber('2')">2</button>
                <button class="btn btn-number" onclick="appendNumber('3')">3</button>
                <button class="btn btn-operator" onclick="toggleSign()">±</button>
                <button class="btn btn-function" onclick="calculateFunction('percent')">%</button>

                <button class="btn btn-number" onclick="appendNumber('0')">0</button>
                <button class="btn btn-number" onclick="appendNumber('.')">.</button>
                <button class="btn btn-equals" onclick="calculate()">=</button>
            </div>
        </div>

        <!-- History Section -->
        <div id="history" class="calculator-section">
            <ul class="history-list" id="historyList"></ul>
            <button class="btn btn-clear history-clear" onclick="clearHistory()">Clear History</button>
        </div>

        <!-- Currency Section -->
        <div id="currency" class="calculator-section">
            <div class="currency-rate" id="exchangeRate">1 USD = ₹83.25 INR (Sample Rate)</div>
            
            <input type="number" class="currency-input" id="usdInput" placeholder="Enter USD amount" min="0" step="any" inputmode="decimal" aria-label="USD amount" oninput="convertCurrency('usd')">
            <input type="number" class="currency-input" id="inrInput" placeholder="Enter INR amount" min="0" step="any" inputmode="decimal" aria-label="INR amount" oninput="convertCurrency('inr')">
            
            <div class="currency-grid">
                <button class="btn btn-function" onclick="setQuickAmount('usd', 1)">$1</button>
                <button class="btn btn-function" onclick="setQuickAmount('usd', 10)">$10</button>
                <button class="btn btn-function" onclick="setQuickAmount('usd', 100)">$100</button>
                <button class="btn btn-function" onclick="setQuickAmount('inr', 100)">₹100</button>
                <button class="btn btn-function" onclick="setQuickAmount('inr', 1000)">₹1000</button>
                <button class="btn btn-function" onclick="setQuickAmount('inr', 5000)">₹5000</button>
                <button class="btn btn-clear" onclick="clearCurrency()">Clear</button>
                <button class="btn btn-function" onclick="updateExchangeRate()">Update Rate</button>
                <button class="btn btn-function" onclick="swapCurrency()">Swap</button>
            </div>
        </div>
    </div>

    <script>
        // ===== State =====
        // The whole expression is kept as a string of tokens:
        // digits, '.', exponent ("1e+21"), constants 'π' / 'e', operators + - * / and parentheses.
        // It is evaluated by a small recursive-descent parser (no eval).
        let expr = '';
        let memory = 0;
        let lastResult = 0;
        let angleMode = 'deg';
        let errorMessage = '';      // non-empty => display shows an error
        let justEvaluated = false;  // last action was "=" (next digit starts fresh)
        let freshOperand = false;   // last action produced a value (function / MR), next digit replaces it
        let lastExpressionText = '';
        let history = [];
        let exchangeRate = 83.25; // USD to INR rate

        const HISTORY_KEY = 'scientificCalculatorHistory';
        const HISTORY_LIMIT = 30;
        const OPERATORS = '+-*/';
        const NUMBER_END_RE = /(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i;

        // ===== Storage (guarded: may be unavailable in sandboxed iframes / private mode) =====
        function loadHistory() {
            try {
                const raw = localStorage.getItem(HISTORY_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                history = Array.isArray(parsed) ? parsed.filter(h => h && typeof h.expr === 'string' && typeof h.result === 'string').slice(0, HISTORY_LIMIT) : [];
            } catch (e) {
                history = [];
            }
        }

        function saveHistory() {
            try {
                localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
            } catch (e) { /* ignore */ }
        }

        // ===== Safe expression parser =====
        function tokenize(str) {
            const tokens = [];
            let i = 0;
            while (i < str.length) {
                const ch = str[i];
                if (ch === ' ') { i++; continue; }
                const numMatch = str.slice(i).match(/^(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?/i);
                if (numMatch) {
                    tokens.push({ type: 'num', value: parseFloat(numMatch[0]) });
                    i += numMatch[0].length;
                    continue;
                }
                if (ch === 'π') { tokens.push({ type: 'num', value: Math.PI }); i++; continue; }
                if (ch === 'e') { tokens.push({ type: 'num', value: Math.E }); i++; continue; }
                if ('+-*/()'.includes(ch)) { tokens.push({ type: 'op', value: ch }); i++; continue; }
                throw new Error('Invalid input');
            }
            return tokens;
        }

        function evaluateExpression(str) {
            const tokens = tokenize(str);
            let pos = 0;
            const peek = () => tokens[pos];
            const isOp = (v) => peek() && peek().type === 'op' && peek().value === v;

            function parseExpr() {
                let value = parseTerm();
                while (isOp('+') || isOp('-')) {
                    const op = tokens[pos++].value;
                    const rhs = parseTerm();
                    value = op === '+' ? value + rhs : value - rhs;
                }
                return value;
            }
            function parseTerm() {
                let value = parseUnary();
                while (isOp('*') || isOp('/')) {
                    const op = tokens[pos++].value;
                    const rhs = parseUnary();
                    if (op === '/') {
                        if (rhs === 0) throw new Error('Cannot divide by 0');
                        value = value / rhs;
                    } else {
                        value = value * rhs;
                    }
                }
                return value;
            }
            function parseUnary() {
                if (isOp('-')) { pos++; return -parseUnary(); }
                if (isOp('+')) { pos++; return parseUnary(); }
                return parsePrimary();
            }
            function parsePrimary() {
                const t = peek();
                if (!t) throw new Error('Invalid input');
                if (t.type === 'num') { pos++; return t.value; }
                if (t.value === '(') {
                    pos++;
                    const v = parseExpr();
                    if (!isOp(')')) throw new Error('Invalid input');
                    pos++;
                    return v;
                }
                throw new Error('Invalid input');
            }

            if (tokens.length === 0) throw new Error('Invalid input');
            const result = parseExpr();
            if (pos !== tokens.length) throw new Error('Invalid input');
            if (!isFinite(result)) throw new Error('Error');
            return result;
        }

        // ===== Helpers =====
        function formatNumber(value) {
            if (Object.is(value, -0) || value === 0) return '0';
            // 15 significant digits hides binary floating-point noise (0.1 + 0.2 -> 0.3)
            const rounded = parseFloat(value.toPrecision(15));
            if (Math.abs(rounded) >= 1e15) return rounded.toExponential();
            return rounded.toString();
        }

        function lastChar() {
            return expr.slice(-1);
        }

        function openParenCount() {
            let open = 0;
            for (const ch of expr) {
                if (ch === '(') open++;
                else if (ch === ')') open--;
            }
            return open;
        }

        function closeExpression(str) {
            let s = str;
            while (s && OPERATORS.includes(s.slice(-1))) s = s.slice(0, -1);
            while (s.endsWith('(')) s = s.slice(0, -1);
            let open = 0;
            for (const ch of s) {
                if (ch === '(') open++;
                else if (ch === ')') open--;
            }
            return s + ')'.repeat(Math.max(0, open));
        }

        // Returns the trailing operand of the expression: {start, text} or null.
        function getTrailingOperand() {
            if (!expr) return null;
            let start;
            if (lastChar() === ')') {
                let depth = 0;
                for (let i = expr.length - 1; i >= 0; i--) {
                    if (expr[i] === ')') depth++;
                    else if (expr[i] === '(') {
                        depth--;
                        if (depth === 0) { start = i; break; }
                    }
                }
                if (start === undefined) return null;
            } else if (lastChar() === 'π' || lastChar() === 'e' && !/\d$/.test(expr.slice(0, -1))) {
                start = expr.length - 1;
            } else {
                const m = expr.match(NUMBER_END_RE);
                if (!m) return null;
                start = expr.length - m[0].length;
            }
            // include a unary minus (at the start or right after '(')
            if (start > 0 && expr[start - 1] === '-' && (start - 1 === 0 || '(*/'.includes(expr[start - 2]))) {
                start--;
            }
            return { start, text: expr.slice(start) };
        }

        function endsWithValue() {
            const c = lastChar();
            return /[\d.)πe]/.test(c);
        }

        // Builds the string to insert for a value at position `start`
        function valueString(value, start) {
            const s = formatNumber(value);
            if (s.startsWith('-') && start > 0 && expr[start - 1] !== '(') {
                return `(${s})`;
            }
            return s;
        }

        function resetIfDone() {
            if (errorMessage || justEvaluated) {
                expr = '';
                errorMessage = '';
                justEvaluated = false;
                freshOperand = false;
            }
        }

        function showError(message) {
            errorMessage = message || 'Error';
            expr = '';
            justEvaluated = false;
            freshOperand = false;
            updateDisplay();
        }

        function prettify(str) {
            return str.replace(/\*/g, '×').replace(/\//g, '÷');
        }

        // ===== UI =====
        function switchMode(mode) {
            document.querySelectorAll('.mode-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.mode === mode);
            });
            document.querySelectorAll('.calculator-section').forEach(section => {
                section.classList.toggle('active', section.id === mode);
            });
            if (mode === 'history') renderHistory();
        }

        function updateDisplay() {
            const display = document.getElementById('mainDisplay');
            const historyLine = document.getElementById('historyDisplay');

            const text = errorMessage || (expr === '' ? '0' : prettify(expr));
            display.textContent = text;
            display.classList.toggle('long', text.length > 14 && text.length <= 22);
            display.classList.toggle('very-long', text.length > 22);

            historyLine.textContent = lastExpressionText;
        }

        function updateMemoryDisplay() {
            const memoryStatus = document.getElementById('memoryStatus');
            const indicator = document.getElementById('memoryIndicator');
            if (memory !== 0) {
                memoryStatus.textContent = `Memory: ${formatNumber(memory)}`;
                memoryStatus.style.background = 'rgba(46, 213, 115, 0.3)';
                indicator.textContent = 'M';
            } else {
                memoryStatus.textContent = 'Memory: Empty';
                memoryStatus.style.background = 'rgba(255, 255, 255, 0.1)';
                indicator.textContent = '';
            }
        }

        function toggleAngleMode() {
            angleMode = angleMode === 'deg' ? 'rad' : 'deg';
            document.getElementById('angleToggle').textContent = angleMode.toUpperCase();
        }

        function addHistory(exprText, resultText) {
            history.unshift({ expr: exprText, result: resultText });
            if (history.length > HISTORY_LIMIT) history.length = HISTORY_LIMIT;
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            if (history.length === 0) {
                const li = document.createElement('li');
                li.className = 'history-empty';
                li.textContent = 'No calculations yet.';
                list.appendChild(li);
                return;
            }
            history.forEach(item => {
                const li = document.createElement('li');
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'history-item';
                btn.title = 'Use this result';
                const e = document.createElement('span');
                e.className = 'expr';
                e.textContent = item.expr + ' =';
                const r = document.createElement('span');
                r.className = 'res';
                r.textContent = item.result;
                btn.append(e, r);
                btn.addEventListener('click', () => {
                    expr = item.result;
                    errorMessage = '';
                    justEvaluated = true;
                    freshOperand = false;
                    lastExpressionText = item.expr + ' =';
                    switchMode('calculator');
                    updateDisplay();
                });
                li.appendChild(btn);
                list.appendChild(li);
            });
        }

        function clearHistory() {
            history = [];
            saveHistory();
            renderHistory();
        }

        // ===== Input handling =====
        function appendNumber(number) {
            resetIfDone();
            if (freshOperand) {
                const operand = getTrailingOperand();
                if (operand) expr = expr.slice(0, operand.start);
                freshOperand = false;
            }

            const c = lastChar();
            const signWrapped = /\(-(?:\d+\.?\d*|\.\d+)\)$/.test(expr);

            if (signWrapped) {
                // keep typing inside "(-12)"
                const inner = expr.slice(0, -1);
                const numPart = inner.match(NUMBER_END_RE)[0];
                if (number === '.' && (numPart.includes('.') || /e/i.test(numPart))) return;
                if (number !== '.' && numPart === '0') {
                    expr = inner.slice(0, -1) + number + ')';
                } else {
                    expr = inner + number + ')';
                }
                updateDisplay();
                return;
            }

            if (c === ')' || c === 'π' || (c === 'e' && !/\d$/.test(expr.slice(0, -1)))) {
                expr += '*';
            }

            const numMatch = expr.match(NUMBER_END_RE);
            const currentNumber = numMatch ? numMatch[0] : '';

            if (number === '.') {
                if (currentNumber.includes('.') || /e/i.test(currentNumber)) return;
                expr += currentNumber ? '.' : '0.';
            } else if (currentNumber === '0') {
                expr = expr.slice(0, -1) + number; // no leading zeros
            } else {
                if (/e[+-]?\d+$/i.test(currentNumber)) return; // don't extend exponent results
                expr += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (op === '×') op = '*';
            if (op === '÷') op = '/';
            if (errorMessage) {
                errorMessage = '';
                expr = '';
            }
            justEvaluated = false;
            freshOperand = false;

            const c = lastChar();
            if (expr === '') {
                expr = op === '-' ? '-' : '0' + op;
            } else if (c === '(') {
                if (op === '-') expr += '-';
            } else if (OPERATORS.includes(c)) {
                const before = expr.slice(0, -1);
                // a unary minus (at start or after '(') cannot become a binary operator
                if (before === '' || before.endsWith('(')) {
                    if (op !== '-') expr = before;
                } else if (c === '-' && (before.endsWith('*') || before.endsWith('/'))) {
                    // "5×-" : replace the operator pair, or keep the unary minus
                    if (op !== '-') expr = before.slice(0, -1) + op;
                } else if (op === '-' && (c === '*' || c === '/')) {
                    expr += '-'; // unary minus after × or ÷, e.g. 5×-3
                } else {
                    expr = before + op;
                }
            } else {
                expr += op;
            }
            updateDisplay();
        }

        function appendParen(paren) {
            if (paren === '(') {
                resetIfDone();
                if (endsWithValue()) expr += '*';
                expr += '(';
                freshOperand = false;
            } else {
                if (errorMessage || justEvaluated) return;
                const c = lastChar();
                if (openParenCount() <= 0 || c === '(' || OPERATORS.includes(c) || c === '') return;
                expr += ')';
                freshOperand = false;
            }
            updateDisplay();
        }

        function calculate() {
            if (errorMessage || expr === '') return;
            const closed = closeExpression(expr);
            if (!closed) return;
            try {
                const result = evaluateExpression(closed);
                const resultText = formatNumber(result);
                const isTrivial = /^-?(?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?$/i.test(closed) && parseFloat(closed) === result;
                lastExpressionText = prettify(closed) + ' =';
                if (!isTrivial) addHistory(prettify(closed), resultText);
                lastResult = result;
                expr = resultText;
                justEvaluated = true;
                freshOperand = false;
                updateDisplay();
            } catch (error) {
                lastExpressionText = prettify(closed) + ' =';
                showError(error.message === 'Cannot divide by 0' ? error.message : 'Error');
            }
        }

        function toRadians(v) {
            return angleMode === 'deg' ? v * Math.PI / 180 : v;
        }

        function snap(v) {
            return Math.abs(v) < 1e-12 ? 0 : v;
        }

        function calculateFunction(func) {
            if (func === 'pi' || func === 'e') {
                resetIfDone();
                if (freshOperand) {
                    const operand = getTrailingOperand();
                    if (operand) expr = expr.slice(0, operand.start);
                    freshOperand = false;
                }
                if (endsWithValue()) expr += '*';
                expr += func === 'pi' ? 'π' : 'e';
                updateDisplay();
                return;
            }

            if (errorMessage) { errorMessage = ''; expr = ''; }
            justEvaluated = false;

            let operand = getTrailingOperand();
            if (!operand) {
                if (expr !== '') return; // expression ends with an operator or '('
                operand = { start: 0, text: '0' };
            }

            let value;
            try {
                value = evaluateExpression(closeExpression(operand.text));
            } catch (e) {
                showError('Error');
                return;
            }

            let result;
            let label;
            const v = formatNumber(value);
            const unit = angleMode === 'deg' ? '°' : ' rad';
            switch (func) {
                case 'sin':
                    result = snap(Math.sin(toRadians(value)));
                    label = `sin(${v}${unit})`;
                    break;
                case 'cos':
                    result = snap(Math.cos(toRadians(value)));
                    label = `cos(${v}${unit})`;
                    break;
                case 'tan': {
                    const r = toRadians(value);
                    if (Math.abs(Math.cos(r)) < 1e-12) { result = NaN; }
                    else result = snap(Math.tan(r));
                    label = `tan(${v}${unit})`;
                    break;
                }
                case 'log':
                    result = value > 0 ? Math.log10(value) : NaN;
                    label = `log(${v})`;
                    break;
                case 'ln':
                    result = value > 0 ? Math.log(value) : NaN;
                    label = `ln(${v})`;
                    break;
                case 'sqrt':
                    result = value >= 0 ? Math.sqrt(value) : NaN;
                    label = `√(${v})`;
                    break;
                case 'power':
                    result = value * value;
                    label = `(${v})²`;
                    break;
                case 'factorial':
                    result = factorial(value);
                    label = `${v}!`;
                    break;
                case 'percent':
                    result = value / 100;
                    label = `${v}%`;
                    break;
                default:
                    return;
            }

            if (isNaN(result) || !isFinite(result)) {
                lastExpressionText = label;
                showError('Error');
                return;
            }

            expr = expr.slice(0, operand.start) + valueString(result, operand.start);
            freshOperand = true;
            lastResult = result;
            lastExpressionText = `${label} = ${formatNumber(result)}`;
            addHistory(label, formatNumber(result));
            updateDisplay();
        }

        function factorial(n) {
            if (n < 0 || n !== Math.floor(n) || n > 170) return NaN;
            let result = 1;
            for (let i = 2; i <= n; i++) {
                result *= i;
            }
            return result;
        }

        function clearAll() {
            expr = '';
            errorMessage = '';
            justEvaluated = false;
            freshOperand = false;
            lastExpressionText = '';
            updateDisplay();
        }

        function clearEntry() {
            if (errorMessage || justEvaluated) {
                clearAll();
                return;
            }
            const operand = getTrailingOperand();
            if (operand) expr = expr.slice(0, operand.start);
            freshOperand = false;
            updateDisplay();
        }

        function backspace() {
            if (errorMessage) {
                clearAll();
                return;
            }
            justEvaluated = false;
            freshOperand = false;
            if (/e[+-]\d+$/i.test(expr)) {
                expr = expr.replace(/(?:\d+\.?\d*|\.\d+)e[+-]\d+$/i, ''); // drop whole exponent number
            } else {
                expr = expr.slice(0, -1);
            }
            updateDisplay();
        }

        function toggleSign() {
            if (errorMessage) return;
            const wrapped = expr.match(/\(-((?:\d+\.?\d*|\.\d+)(?:e[+-]?\d+)?|π|e)\)$/i);
            if (wrapped) {
                expr = expr.slice(0, expr.length - wrapped[0].length) + wrapped[1];
                updateDisplay();
                return;
            }
            const operand = getTrailingOperand();
            if (!operand) return;
            let text = operand.text;
            if (text.startsWith('-')) {
                expr = expr.slice(0, operand.start) + text.slice(1);
            } else if (operand.start === 0 || expr[operand.start - 1] === '(') {
                expr = expr.slice(0, operand.start) + '-' + text;
            } else {
                expr = expr.slice(0, operand.start) + '(-' + text + ')';
            }
            justEvaluated = false;
            updateDisplay();
        }

        function currentValue() {
            if (errorMessage || expr === '') return 0;
            try {
                return evaluateExpression(closeExpression(expr));
            } catch (e) {
                return null;
            }
        }

        function memoryStore() {
            const v = currentValue();
            if (v === null) return;
            memory = v;
            updateMemoryDisplay();
        }

        function memoryRecall() {
            resetIfDone();
            const operand = getTrailingOperand();
            if (operand) {
                expr = expr.slice(0, operand.start) + valueString(memory, operand.start);
            } else {
                expr += valueString(memory, expr.length);
            }
            freshOperand = true;
            updateDisplay();
        }

        function memoryClear() {
            memory = 0;
            updateMemoryDisplay();
        }

        function memoryAdd() {
            const v = currentValue();
            if (v === null) return;
            memory += v;
            updateMemoryDisplay();
        }

        function memorySubtract() {
            const v = currentValue();
            if (v === null) return;
            memory -= v;
            updateMemoryDisplay();
        }

        // ===== Currency functions =====
        function convertCurrency(from) {
            const usdInput = document.getElementById('usdInput');
            const inrInput = document.getElementById('inrInput');
            const source = from === 'usd' ? usdInput : inrInput;
            const target = from === 'usd' ? inrInput : usdInput;

            if (source.value === '') {
                target.value = '';
                return;
            }
            const value = parseFloat(source.value);
            if (isNaN(value)) {
                target.value = '';
                return;
            }
            target.value = (from === 'usd' ? value * exchangeRate : value / exchangeRate).toFixed(2);
        }

        function setQuickAmount(currency, amount) {
            if (currency === 'usd') {
                document.getElementById('usdInput').value = amount;
                convertCurrency('usd');
            } else {
                document.getElementById('inrInput').value = amount;
                convertCurrency('inr');
            }
        }

        function clearCurrency() {
            document.getElementById('usdInput').value = '';
            document.getElementById('inrInput').value = '';
        }

        // Swap: convert the same amount in the opposite direction (e.g. $100 -> ₹100)
        function swapCurrency() {
            const usdInput = document.getElementById('usdInput');
            const inrInput = document.getElementById('inrInput');
            const amount = usdInput.value;
            if (amount === '') {
                if (inrInput.value !== '') {
                    usdInput.value = inrInput.value;
                    convertCurrency('usd');
                }
                return;
            }
            inrInput.value = amount;
            convertCurrency('inr');
        }

        function updateExchangeRate() {
            // Simulate getting a new exchange rate
            exchangeRate = 83.25 + (Math.random() - 0.5) * 2;
            document.getElementById('exchangeRate').textContent = `1 USD = ₹${exchangeRate.toFixed(2)} INR (Updated Rate)`;

            // Reconvert if there's a value
            const usdInput = document.getElementById('usdInput');
            if (usdInput.value) {
                convertCurrency('usd');
            }
        }

        // ===== Initialize =====
        loadHistory();
        updateDisplay();
        updateMemoryDisplay();
        renderHistory();

        document.querySelectorAll('.mode-tab').forEach(tab => {
            tab.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    event.stopPropagation();
                    switchMode(tab.dataset.mode);
                }
            });
        });

        // ===== Keyboard support =====
        document.addEventListener('keydown', function(event) {
            const target = event.target;
            if (target && (target.tagName === 'INPUT' || target.tagName === 'TEXTAREA' || target.tagName === 'SELECT' || target.isContentEditable)) return;
            if (event.ctrlKey || event.metaKey || event.altKey) return;
            if (!document.getElementById('calculator').classList.contains('active')) return;

            const key = event.key;
            let handled = true;

            if (key >= '0' && key <= '9') {
                appendNumber(key);
            } else if (key === '.' || key === ',') {
                appendNumber('.');
            } else if (key === '+' || key === '-' || key === '*' || key === '/') {
                appendOperator(key);
            } else if (key === 'x' || key === 'X') {
                appendOperator('*');
            } else if (key === '(' || key === ')') {
                appendParen(key);
            } else if (key === '%') {
                calculateFunction('percent');
            } else if (key === '!') {
                calculateFunction('factorial');
            } else if (key === 'Enter' || key === '=') {
                calculate();
            } else if (key === 'Escape') {
                clearAll();
            } else if (key === 'Delete') {
                clearEntry();
            } else if (key === 'Backspace') {
                backspace();
            } else {
                handled = false;
            }

            if (handled) event.preventDefault();
        });
    </script>
</body>
